[package]
name = "cipherpot-contracts"
version = "0.1.0"
edition = "2021"
authors = ["CipherPot Contributors"]
description = "NEAR smart contract for CipherPot deduction game"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29.1", features = ["legacy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
overflow-checks = true
lto = true
debug = false
panic = "abort"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
